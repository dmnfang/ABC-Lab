<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alphabet Jumble</title>
<link rel="stylesheet" href="../../css/clr.css">
<style>
:root{
  --bg:#f7f1e7;--panel:#fffaf2;--ink:#28232a;--muted:#817a7e;
  --sand:#e7cda8;--sand-deep:#d7b887;--grape:#73549a;--grape2:#5f4385;
  --line:#ded4c7;--soft:#eee5d9
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
header{
  position:relative;
  height:66px;min-height:66px;padding:0 24px;display:flex;align-items:center;
  border-bottom:1px solid var(--line);background:var(--panel);z-index:5
}
.brand{font-size:17px;font-weight:900;letter-spacing:.085em}
.brand-row{display:flex;align-items:center;gap:12px}
.home-link{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.home-link:hover{background:var(--soft)}
.home-icon{width:38px;padding:0;display:grid;place-items:center}.home-icon svg{width:19px;height:19px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.header-result{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:13px;font-weight:900;letter-spacing:.08em;text-align:center;
  white-space:nowrap;pointer-events:none
}
.spread{display:flex;align-items:center;gap:7px}
.pip{
  width:34px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0;
  background:var(--panel);color:var(--ink);font-size:12px;font-weight:900;
  cursor:pointer;display:grid;place-items:center;
  transition:transform .15s,background .15s,border-color .15s,color .15s
}
.pip:hover{transform:translateY(-1px);background:var(--soft)}
.pip.active{background:var(--grape);border-color:var(--grape);color:#fff}
.settings-icon{
  width:38px;height:38px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);display:grid;place-items:center;cursor:pointer;font-size:18px
}

/* PLAY */
.app{height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.play-main{
  width:100%;height:calc(100vh - 66px);box-sizing:border-box;min-height:0;
  padding:20px;display:grid;
  grid-template-columns:minmax(0,1fr) 108px 380px;
  gap:16px;overflow:hidden
}
.jumble-area{
  min-width:0;min-height:0;position:relative;overflow:hidden;
  background:#fffdf8;border:1px solid var(--line);border-radius:18px
}
.collage{position:absolute;inset:0;overflow:hidden}
.letter{
  position:absolute;width:320px;height:320px;display:grid;place-items:center;
  transform:translate(-50%,-50%);font-size:300px;font-weight:900;line-height:.8;
  color:var(--grape);user-select:none;pointer-events:none;
  transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1)
}
.letter.reveal{transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1)}

.guess-tray{
  min-width:0;min-height:0;overflow:hidden;
  border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:12px 8px;background:#fffdf8
}
.guess-chip{
  flex:0 0 auto;width:76px;height:76px;padding:0;border:0;border-radius:13px;
  background:var(--sand);font-size:48px;font-weight:900;cursor:pointer
}
.guess-chip:hover{background:var(--sand-deep);transform:translateY(-1px)}

.play-right{
  min-width:0;min-height:0;height:100%;
  display:flex;flex-direction:column;overflow:hidden
}
.selector-heading{
  flex:0 0 auto;font-size:12px;font-weight:900;letter-spacing:.11em;margin:2px 0 9px
}
.case-bank{
  flex:0 0 auto;display:none;gap:5px;margin:0 0 9px;padding:4px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel)
}
.case-bank.visible{display:flex}
.case-bank button{
  flex:1;border:0;border-radius:7px;background:transparent;
  padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer
}
.case-bank button.active{background:var(--ink);color:#fff}

.alphabet{
  flex:0 0 auto;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;overflow:hidden
}
.letter-btn{
  width:100%;aspect-ratio:1;min-width:0;min-height:0;
  border:1px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:20px;font-weight:900;cursor:pointer
}
.letter-btn:hover{background:var(--soft);transform:translateY(-1px)}

.action-area{
  flex:0 0 72px;height:72px;box-sizing:border-box;
  margin-top:auto;padding:8px 0;
  display:flex;align-items:center;justify-content:center
}
.result{min-height:19px;text-align:center;color:var(--ink);font-size:12px;font-weight:900;letter-spacing:.03em}
.result strong{color:var(--ink)}
.actions{display:flex;justify-content:center;gap:9px}
.primary,.secondary{
  min-width:190px;height:52px;border:0;border-radius:12px;padding:0 24px;
  font-weight:900;font-size:13px;cursor:pointer
}
.primary{background:var(--grape);color:#fff}.primary:hover{background:var(--grape2)}
.secondary{background:var(--sand)}
.hidden{display:none!important}

@media(max-width:1050px){
  .play-main{grid-template-columns:minmax(0,1fr) 96px 320px;padding:16px;gap:12px}
  .guess-chip{width:68px;height:68px;font-size:42px}
  .letter-btn{font-size:18px}
}
@media(max-width:700px){
  .app{height:auto;min-height:100vh;overflow:visible}
  .play-main{
    height:auto;min-height:0;grid-template-columns:1fr;grid-template-rows:minmax(440px,1fr) auto auto;
    padding:14px;overflow:visible
  }
  .jumble-area{min-height:440px}
  .guess-tray{
    min-height:96px;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    justify-content:flex-start;padding:10px
  }
  .play-right{height:auto;min-height:520px;overflow:visible}
  .alphabet{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .action-area{flex:0 0 92px;height:92px;margin-top:14px}
}
/* SETTINGS */
.settings-screen{display:none;min-height:100vh;flex-direction:column}
.settings-screen.active{display:flex}
.settings-main{width:min(1080px,100%);margin:auto;padding:42px 28px 54px}
.settings-title{font-size:34px;font-weight:900;letter-spacing:-.035em;margin:0 0 7px}
.settings-sub{color:var(--muted);margin:0 0 30px}
.settings-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start
}
.setting-label{
  font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;
  margin:0 0 10px
}
.setting-card{
  border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:8px
}
.setting-options{display:grid;gap:5px}
.option-btn{
  border:0;background:transparent;border-radius:11px;padding:13px 15px;
  display:flex;align-items:center;justify-content:space-between;text-align:left;
  cursor:pointer;font-weight:850
}
.option-btn:hover{background:var(--soft)}
.option-btn.active{background:var(--grape);color:#fff}
.letter-counts{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.count-toggle{
  aspect-ratio:1;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);font-size:20px;font-weight:900;cursor:pointer
}
.count-toggle.active{background:var(--grape);color:#fff;border-color:var(--grape)}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.settings-actions{display:flex;justify-content:flex-end;margin-top:24px}
.play-btn{
  border:0;border-radius:13px;padding:14px 28px;background:var(--grape);
  color:#fff;font-weight:900;cursor:pointer
}
.play-btn:hover{background:var(--grape2)}

@media(max-width:900px){
  .play-main{grid-template-columns:1.7fr 1fr;padding:16px}
  .letter{width:260px;height:260px;font-size:240px}
  .letter-btn{font-size:17px}
}
@media(max-width:700px){
  header{padding:0 12px}.brand{font-size:15px}
  .header-result{font-size:10px}
  .header-right{gap:8px}
  .spread{gap:4px}
  .pip{width:30px;height:30px}
  .play-main{grid-template-columns:1fr;height:auto;min-height:0;overflow:visible}
  .jumble-area{min-height:420px}
  .play-right{min-height:500px;overflow:visible}
  .action-area{height:72px;min-height:72px}
  .settings-main{padding:30px 18px}
  .settings-grid{grid-template-columns:1fr}
  .settings-actions{justify-content:stretch}
  .play-btn{width:100%}
}

/* MVP 25: iPad landscape layout and viewport-safe sizing */
html, body {
  width: 100%;
  min-height: 100%;
  min-height: 100dvh;
  overflow: hidden;
}
.app {
  height: 100dvh;
  min-height: 100dvh;
}
.play-main {
  height: calc(100dvh - 66px);
  min-height: 0;
  grid-template-columns: minmax(0, 1fr) minmax(0, 460px);
  grid-template-rows: minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
}
.jumble-area {
  min-height: 0;
}
.guess-tray {
  grid-column: 2;
  grid-row: 1;
  min-height: 72px;
  height: 72px;
  flex-direction: row;
  justify-content: flex-start;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 10px;
  gap: 8px;
}
.guess-chip {
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  font-size: 34px;
}
.play-right {
  grid-column: 2;
  grid-row: 1;
  padding-top: 88px;
  min-height: 0;
}
.alphabet {
  flex: 1 1 auto;
  min-height: 0;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: 8px;
  align-content: stretch;
}
.letter-btn {
  aspect-ratio: auto;
  min-height: 0;
  height: 100%;
}
.action-area {
  flex: 0 0 72px;
  height: 72px;
  margin-top: 12px;
  padding: 8px 0;
}

/* The reveal is sized from the actual canvas instead of a fixed 320px footprint. */
.letter {
  width: var(--letter-size, 220px);
  height: var(--letter-size, 220px);
  font-size: var(--letter-font, 200px);
}

@media (max-height: 760px) and (orientation: landscape) {
  header { height: 56px; min-height: 56px; padding: 0 18px; }
  .play-main { height: calc(100dvh - 56px); padding: 12px; gap: 12px; }
  .play-right { padding-top: 82px; }
  .guess-tray { height: 70px; min-height: 70px; }
  .guess-chip { width: 52px; height: 52px; flex-basis: 52px; font-size: 31px; }
  .selector-heading { margin-top: 0; margin-bottom: 6px; }
  .alphabet { gap: 6px; }
  .letter-btn { font-size: 18px; }
  .action-area { height: 72px; flex-basis: 72px; margin-top: 8px; }
  .primary, .secondary { padding: 8px 18px; }
}

@media (max-width: 800px) and (orientation: portrait) {
  html, body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .play-main {
    height: auto; min-height: calc(100dvh - 56px);
    grid-template-columns: 1fr; grid-template-rows: minmax(360px, 52dvh) auto auto;
    overflow: visible;
  }
  .guess-tray, .play-right { grid-column: 1; grid-row: auto; }
  .guess-tray { height: 78px; min-height: 78px; padding: 8px 10px; }
  .play-right { padding-top: 0; min-height: 0; }
  .alphabet { flex: 0 0 auto; grid-auto-rows: auto; }
  .letter-btn { aspect-ratio: 1; height: auto; }
  .action-area { margin-top: 12px; }
}
/* Responsive guess tray: all eight selections fit without horizontal scrolling. */
.guess-tray{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  align-items:center;
  justify-items:center;
  gap:clamp(4px,0.7vw,8px);
  padding:8px 10px;
  overflow:hidden;
}
.guess-chip{
  width:100%;
  max-width:56px;
  aspect-ratio:1;
  height:auto;
  min-width:0;
  flex:none;
  font-size:clamp(18px,2.7vw,34px);
}
@media (max-width:1050px){
  .guess-tray{gap:5px;padding:7px}
  .guess-chip{max-width:48px;font-size:28px}
}
@media (max-height:760px) and (orientation:landscape){
  .guess-tray{height:70px;min-height:70px}
  .guess-chip{max-width:48px;font-size:27px}
}
@media (max-width:800px) and (orientation:portrait){
  .guess-tray{height:78px;min-height:78px;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:7px}
  .guess-chip{max-width:48px;font-size:26px}
}


/* Responsive guess tray: all eight selections fit without horizontal scrolling. */
.guess-tray{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  align-items:center;
  justify-items:center;
  gap:clamp(4px,0.7vw,8px);
  padding:8px 10px;
  overflow:hidden;
}
.guess-chip{
  width:100%; max-width:56px; aspect-ratio:1; height:auto; min-width:0; flex:none;
  font-size:clamp(18px,2.7vw,34px);
}
@media (max-width:1050px){.guess-tray{gap:5px;padding:7px}.guess-chip{max-width:48px;font-size:28px}}
@media (max-height:760px) and (orientation:landscape){.guess-tray{height:70px;min-height:70px}.guess-chip{max-width:48px;font-size:27px}}
@media (max-width:800px) and (orientation:portrait){.guess-tray{height:78px;min-height:78px;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:7px}.guess-chip{max-width:48px;font-size:26px}}

/* Settings layout aligned with ABC Remix */
.settings-screen{display:flex;min-height:100dvh;flex-direction:column;padding:24px 22px 22px;gap:18px}
.settings-screen > .settings-header{height:34px;min-height:34px;display:flex;align-items:center;justify-content:space-between;flex:0 0 34px}
.settings-header .brand{font-family:Fredoka,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.02em}
.settings-header .home-icon{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--sand-50,#ede6d4)}
.settings-header .home-icon svg{width:17px;height:17px}
.settings-grid{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.setting-panel{min-width:0;min-height:0;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;overflow:hidden}
.setting-panel h2{font-family:Fredoka,sans-serif;font-size:20px;line-height:1;margin:0 0 18px;font-weight:500}
.control-section{flex-shrink:0;margin-top:20px}
.setting-panel h2 + .control-section{margin-top:0}
.control-section > label{display:block;margin-bottom:8px;font-size:12px;line-height:1.2;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pill-group{display:flex;gap:10px;flex-wrap:wrap}
.pill-group .pill{height:34px;padding:0 14px;border-radius:9999px;background:#ede6d4;color:var(--ink);font-size:12px;font-weight:800;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pill-group .pill.active{background:var(--grape);color:#fff}
.pill-group .pill:hover{transform:translateY(-1px)}
.count-group{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.count-group .pill,.count-group .count-toggle{width:100%;min-width:0;padding:0;height:34px;aspect-ratio:auto;border-radius:9999px;background:#ede6d4;color:var(--ink);font-size:12px;font-weight:800;border:0;display:inline-flex;align-items:center;justify-content:center}
.count-group .pill.active,.count-group .count-toggle.active{background:var(--grape);color:#fff;border-color:var(--grape)}
.question-group{gap:10px}
.settings-note{font-size:11px;line-height:1.3;color:var(--muted);margin:10px 0 0}
.setting-panel-right .launch-button{width:100%;height:54px;margin-top:auto;border-radius:13px;background:var(--grape);color:#fff;font-size:14px;font-weight:900;box-shadow:inset 0 -4px 0 var(--grape2)}
@media(max-width:1000px){.settings-screen{padding:22px}.settings-grid{grid-template-columns:1fr}.setting-panel{min-height:420px}}
@media(max-width:600px){.settings-screen{padding:16px;gap:16px}.settings-grid{gap:16px}.setting-panel{padding:18px}.settings-header .brand{font-size:20px}.count-group{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<div id="playScreen" class="app" style="display:none">
<header>
  <div class="brand-row"><button id="homeButton" class="home-link home-icon" type="button" aria-label="ABC Lab home" title="ABC Lab home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></button><div class="brand">ALPHABET JUMBLE</div></div>
  <div id="headerResult" class="header-result">SELECT LETTERS</div>
  <div class="header-right">
    <div class="spread" aria-label="Jumble spread">
      <button class="pip active" data-jumble="85" aria-label="Jumble level 1">1</button>
      <button class="pip" data-jumble="80" aria-label="Jumble level 2">2</button>
      <button class="pip" data-jumble="75" aria-label="Jumble level 3">3</button>
    </div>
    <button id="fullscreenButton" class="settings-icon" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    <button id="settingsButton" class="settings-icon" aria-label="Settings" title="Settings">⚙</button>
  </div>
</header>

<main class="play-main">
  <section class="jumble-area">
    <div id="collage" class="collage"></div>
  </section>

  <section id="guessTray" class="guess-tray" aria-label="Selected letters"></section>

  <section class="play-right">
    <div class="selector-heading">SELECT LETTERS</div>
    <div id="caseBank" class="case-bank">
      <button class="active" data-bank="upper">UPPER</button>
      <button data-bank="lower">LOWER</button>
    </div>
    <div id="alphabet" class="alphabet"></div>
    <div class="action-area">
      <div class="actions">
        <button id="submit" class="primary">SUBMIT</button>
        <button id="next" class="secondary hidden">NEXT JUMBLE</button>
      </div>
    </div>
  </section>
</main>
</div>

<div id="settingsScreen" class="settings-screen active">
<header class="settings-header">
  <div class="brand-row"><button id="settingsHomeButton" class="home-link home-icon" type="button" aria-label="ABC Lab home" title="ABC Lab home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></button><div class="brand">ALPHABET JUMBLE</div></div>
</header>
<div class="settings-grid">
  <section class="setting-panel">
    <h2>Quiz Settings</h2>
    <div class="control-section">
      <label>Letter Case</label>
      <div class="pill-group" role="group" aria-label="Letter case">
        <button class="pill active" data-setting-case="upper" type="button"><span>ABC</span><span>Uppercase</span></button>
        <button class="pill" data-setting-case="lower" type="button"><span>abc</span><span>Lowercase</span></button>
        <button class="pill" data-setting-case="mixed" type="button"><span>Aa</span><span>Mixed case</span></button>
      </div>
    </div>
    <div class="control-section">
      <label>Letters per Jumble</label>
      <div class="pill-group count-group" id="countToggles" role="group" aria-label="Letters per jumble"></div>
      <p class="settings-note">Choose which puzzle sizes can appear.</p>
    </div>
  </section>

  <section class="setting-panel setting-panel-right">
    <h2>Quiz Length</h2>
    <div class="control-section">
      <label>Number of Questions</label>
      <div class="pill-group question-group" role="group" aria-label="Number of questions">
        <button class="pill active" data-questions="10" type="button">10 questions</button>
        <button class="pill" data-questions="15" type="button">15 questions</button>
        <button class="pill" data-questions="20" type="button">20 questions</button>
        <button class="pill" data-questions="999" type="button">Unlimited</button>
      </div>
    </div>
    <button id="startQuiz" class="launch-button" type="button">Start Quiz</button>
  </section>
</div>
</div>

<script>
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const settings={
  caseMode:"upper",
  questions:10,
  allowedCounts:new Set([3,4,5,6])
};

const state={
  caseMode:"upper",
  jumble:85,
  letters:[],
  selected:[],
  revealed:false,
  currentQuestion:1
};

const playScreen=document.getElementById("playScreen");
const settingsScreen=document.getElementById("settingsScreen");
const collage=document.getElementById("collage");
const alphabetEl=document.getElementById("alphabet");
const guessTray=document.getElementById("guessTray");
const resultEl=document.getElementById("headerResult");
const submitBtn=document.getElementById("submit");
const nextBtn=document.getElementById("next");

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}

function makePuzzle(){
  const counts=[...settings.allowedCounts];
  const n=counts[Math.floor(Math.random()*counts.length)];

  state.caseMode=settings.caseMode;
  state.bank="upper";
  state.jumble=85;
  state.revealed=false;
  state.selected=[];

  if(state.caseMode==="upper"){
    state.letters=shuffled(alphabet).slice(0,n);
  }else if(state.caseMode==="lower"){
    state.letters=shuffled(alphabet.map(x=>x.toLowerCase())).slice(0,n);
  }else{
    const out=[],used=new Set();
    while(out.length<n){
      const base=alphabet[Math.floor(Math.random()*26)];
      if(used.has(base))continue;
      used.add(base);
      out.push(Math.random()<.5?base:base.toLowerCase());
    }
    state.letters=out;
  }

  document.querySelectorAll(".pip").forEach((p,i)=>p.classList.toggle("active",i===0));
  resultEl.textContent="WHICH LETTERS?";
  submitBtn.classList.remove("hidden");
  nextBtn.classList.add("hidden");
  nextBtn.textContent="NEXT JUMBLE";

  renderAlphabet();
  renderGuess();
  renderCollage();
}

function getRevealGeometry(){
  const w=collage.clientWidth;
  const h=collage.clientHeight;
  const d=Math.max(1,Math.min(w,h));
  const n=Math.max(1,state.letters.length);
  const margin=Math.max(12,Math.min(28,d*.035));
  const halfAngle=Math.PI/n;
  const fitSize=(d-2*margin)*Math.sin(halfAngle)/(1+Math.sin(halfAngle));
  const maxSize=Math.min(520,d*.58);
  // Scale the original ring-fit size up slightly, while still reserving enough
  // circumference for every letter to remain visually distinguishable.
  const size=Math.max(96,Math.min(maxSize,fitSize*1.05));
  const radius=Math.max(0,d/2-size/2-margin);
  return {w,h,size,radius};
}

function renderCollage(){
  collage.innerHTML="";
  const n=state.letters.length;
  const {w,h,size,radius}=getRevealGeometry();
  const spreadMap={85:.45,80:.68,75:.9};
  const previewRadius=state.revealed
    ? radius
    : radius*(spreadMap[state.jumble] ?? .43);

  state.letters.forEach((char,i)=>{
    const el=document.createElement("div");
    el.className="letter";
    el.textContent=char;
    el.style.setProperty("--letter-size",`${size}px`);
    el.style.setProperty("--letter-font",`${Math.round(size*.92)}px`);

    const angle=-Math.PI/2+i*(Math.PI*2/n);
    el.style.left=w/2+Math.cos(angle)*previewRadius+"px";
    el.style.top=h/2+Math.sin(angle)*previewRadius+"px";

    collage.appendChild(el);
  });
}

function renderGuess(){
  guessTray.innerHTML="";

  state.selected.forEach(char=>{
    const chip=document.createElement("button");
    chip.className="guess-chip";
    chip.textContent=char;
    chip.title="Remove "+char;

    chip.onclick=()=>{
      if(state.revealed)return;
      state.selected=state.selected.filter(x=>x!==char);
      renderGuess();
    };

    guessTray.appendChild(chip);
  });
}

function renderAlphabet(){
  alphabetEl.innerHTML="";
  const bank=document.getElementById("caseBank");
  bank.classList.toggle("visible",state.caseMode==="mixed");

  let chars;
  if(state.caseMode==="upper"){
    chars=alphabet;
  }else if(state.caseMode==="lower"){
    chars=alphabet.map(x=>x.toLowerCase());
  }else{
    chars=state.bank==="upper"
      ? alphabet
      : alphabet.map(x=>x.toLowerCase());
  }

  document.querySelectorAll("#caseBank button").forEach(button=>{
    button.classList.toggle("active",button.dataset.bank===state.bank);
  });

  chars.forEach(char=>{
    const button=document.createElement("button");
    button.className="letter-btn";
    button.textContent=char;

    button.onclick=()=>{
      if(state.revealed)return;
      if(state.selected.includes(char))return;
      state.selected.push(char);
      renderGuess();
    };

    alphabetEl.appendChild(button);
  });
}

function reveal(){
  if(state.revealed)return;

  state.revealed=true;
  submitBtn.classList.add("hidden");

  const found=state.letters.filter(x=>state.selected.includes(x)).length;

  resultEl.innerHTML=
    "<strong>THERE WERE "+state.letters.length+
    " LETTERS</strong> · YOU FOUND "+found+"/"+state.letters.length;

  const {w,h,radius}=getRevealGeometry();

  [...collage.children].forEach((el,i)=>{
    const angle=-Math.PI/2+i*(Math.PI*2/state.letters.length);

    setTimeout(()=>{
      el.style.left=w/2+Math.cos(angle)*radius+"px";
      el.style.top=h/2+Math.sin(angle)*radius+"px";
    },i*180);
  });

  nextBtn.textContent=
    settings.questions!==999 &&
    state.currentQuestion>=settings.questions
      ?"FINISH":"NEXT JUMBLE";

  nextBtn.classList.remove("hidden");
}

function nextPuzzle(){
  if(settings.questions!==999 &&
     state.currentQuestion>=settings.questions){
    openSettings();
    return;
  }

  state.currentQuestion++;
  makePuzzle();
}

function openSettings(){
  playScreen.style.display="none";
  settingsScreen.classList.add("active");
  syncSettingsUI();
}

function startQuiz(){
  state.currentQuestion=1;
  playScreen.style.display="flex";
  settingsScreen.classList.remove("active");
  makePuzzle();
}

function syncSettingsUI(){
  document.querySelectorAll("[data-setting-case]").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.settingCase===settings.caseMode
    );
  });

  document.querySelectorAll("[data-questions]").forEach(button=>{
    button.classList.toggle(
      "active",
      +button.dataset.questions===settings.questions
    );
  });

  document.querySelectorAll(".count-toggle").forEach(button=>{
    button.classList.toggle(
      "active",
      settings.allowedCounts.has(+button.dataset.count)
    );
  });
}

document.querySelectorAll(".pip").forEach(pip=>{
  pip.onclick=()=>{
    if(state.revealed)return;

    state.jumble=+pip.dataset.jumble;

    document.querySelectorAll(".pip").forEach(p=>{
      p.classList.toggle("active",p===pip);
    });

    renderCollage();
  };
});

document.querySelectorAll("#caseBank button").forEach(button=>{
  button.onclick=()=>{
    if(state.revealed || state.caseMode!=="mixed")return;
    state.bank=button.dataset.bank;
    renderAlphabet();
  };
});

document.getElementById("settingsButton").onclick=openSettings;
document.getElementById("homeButton").onclick=()=>location.href="../../index.html";
document.getElementById("settingsHomeButton").onclick=()=>location.href="../../index.html";

document.getElementById("fullscreenButton").onclick=async()=>{
  try{
    const isFullscreen=!!(
      document.fullscreenElement ||
      document.webkitFullscreenElement
    );

    if(isFullscreen){
      if(document.exitFullscreen){
        await document.exitFullscreen();
      }else if(document.webkitExitFullscreen){
        document.webkitExitFullscreen();
      }
    }else{
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
      }else if(document.documentElement.webkitRequestFullscreen){
        document.documentElement.webkitRequestFullscreen();
      }
    }
  }catch(e){}
};

submitBtn.onclick=reveal;
nextBtn.onclick=nextPuzzle;

document.querySelectorAll("[data-setting-case]").forEach(button=>{
  button.onclick=()=>{
    settings.caseMode=button.dataset.settingCase;
    syncSettingsUI();
  };
});

document.querySelectorAll("[data-questions]").forEach(button=>{
  button.onclick=()=>{
    settings.questions=+button.dataset.questions;
    syncSettingsUI();
  };
});

const countToggles=document.getElementById("countToggles");

[2,3,4,5,6,7,8].forEach(n=>{
  const button=document.createElement("button");

  button.className="count-toggle";
  button.dataset.count=n;
  button.textContent=n;

  button.onclick=()=>{
    if(settings.allowedCounts.has(n)){
      if(settings.allowedCounts.size===1)return;
      settings.allowedCounts.delete(n);
    }else{
      settings.allowedCounts.add(n);
    }

    syncSettingsUI();
  };

  countToggles.appendChild(button);
});

document.getElementById("startQuiz").onclick=startQuiz;

function updateFullscreenIcon(){
  const button=document.getElementById("fullscreenButton");
  button.textContent=document.fullscreenElement?"⛶":"⛶";
}
document.addEventListener("fullscreenchange",updateFullscreenIcon);

window.addEventListener("resize",()=>{
  if(playScreen.style.display!=="none"){
    renderCollage();
  }
});

syncSettingsUI();
</script>
</body>
</html>
