<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2E9">
  <title>ABC Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=7">
  <link rel="stylesheet" href="../../assets/css/base.css?v=7">
  <link rel="stylesheet" href="./trail.css?v=7">
</head>
<body data-game="trail">

  <!-- Settings -->
  <main id="settingsScreen" class="app-shell screen">
    <header class="app-header">
      <div class="header-left">
        <a class="icon-btn" href="../../index.html" data-icon="house" aria-label="ABC Lab home" title="ABC Lab home"></a>
        <h1 class="brand-name">ABC Trail</h1>
      </div>
      <div class="header-actions">
        <button id="settingsFullscreen" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
    </header>

    <div class="settings-main">
      <section class="panel panel--card">
        <h2 class="panel-title">Trail Settings</h2>

        <div class="control-section">
          <div class="settings-label">Trace Speed</div>
          <div class="toggle-group" id="speed" role="group" aria-label="Trace speed">
            <button class="toggle-pill" data-v="0.7" type="button">Slow</button>
            <button class="toggle-pill active" data-v="1" type="button">Normal</button>
            <button class="toggle-pill" data-v="1.35" type="button">Fast</button>
            <button class="toggle-pill" data-v="1.8" type="button">Very Fast</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Trail Length</div>
          <div class="toggle-group" id="trail" role="group" aria-label="Trail length">
            <button class="toggle-pill" data-v="0" type="button">None</button>
            <button class="toggle-pill" data-v="1" type="button">Short</button>
            <button class="toggle-pill active" data-v="2" type="button">Medium</button>
            <button class="toggle-pill" data-v="3" type="button">Long</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Letter Case</div>
          <div class="toggle-group" id="case" role="group" aria-label="Letter case">
            <button class="toggle-pill active" data-v="uppercase" type="button"><span class="pill-sample">ABC</span>Uppercase</button>
            <button class="toggle-pill" data-v="lowercase" type="button"><span class="pill-sample">abc</span>Lowercase</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Letters per Sequence</div>
          <p class="settings-note">Letters come from the mastered-letter pool and never repeat within a sequence.</p>
          <div class="toggle-group" id="count" role="group" aria-label="Letters per sequence">
            <button class="toggle-pill-circle active" data-v="1" type="button">1</button>
            <button class="toggle-pill-circle" data-v="2" type="button">2</button>
            <button class="toggle-pill-circle" data-v="3" type="button">3</button>
            <button class="toggle-pill-circle" data-v="4" type="button">4</button>
            <button class="toggle-pill-circle" data-v="5" type="button">5</button>
            <button class="toggle-pill-circle" data-v="6" type="button">6</button>
          </div>
        </div>
      </section>

      <section class="panel panel--card">
        <h2 class="panel-title">Letter Pool</h2>
        <p class="settings-note">Select the letters your students have mastered.</p>
        <div id="pool" class="pool"></div>
        <div class="pool-actions">
          <button id="selectAll" class="btn" type="button">Select All</button>
          <button id="clearAll" class="btn" type="button">Clear All</button>
        </div>
        <button id="startTrail" class="launch-btn" type="button">Start Trail</button>
      </section>
    </div>
  </main>

  <!-- Play -->
  <main id="playScreen" class="app-shell screen" hidden>
    <header class="app-header play-header">
      <div class="header-left">
        <a class="icon-btn" href="../../index.html" data-icon="house" aria-label="ABC Lab home" title="ABC Lab home"></a>
        <h1 class="brand-name">ABC Trail</h1>
        <div id="sequence" class="pips" aria-label="Letters in this round"></div>
      </div>

      <div class="header-center">
        <button id="playBtn" class="header-btn header-btn--accent" type="button"></button>
        <button id="revealBtn" class="header-btn" type="button" disabled><span data-icon="eye"></span>Reveal</button>
        <button id="nextBtn" class="header-btn" type="button" disabled><span data-icon="skip-forward"></span>Next</button>
      </div>

      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" type="button" data-icon="gear" aria-label="Settings" title="Settings"></button>
        <button id="playFullscreen" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
    </header>

    <div class="play-main">
      <section class="panel panel--card stage-panel">
        <div class="stage-main" id="stageMain">
          <svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
            <g id="stageShift">
              <g id="trailLayer"></g>
              <g id="dotLayer"></g>
            </g>
          </svg>
          <div class="answer" id="answer">
            <span id="answerLetter"></span>
          </div>
        </div>
      </section>

      <aside class="panel panel--card guess-panel">
        <div class="guess-head">
          <span class="settings-label">Your guess</span>
          <span id="guessCount" class="guess-count"></span>
        </div>
        <div id="guessGrid" class="guess-grid"></div>
        <button id="checkBtn" class="launch-btn" type="button" disabled>Check</button>
      </aside>
    </div>
  </main>

  <script type="module" src="./trail.js?v=7"></script>
</body>
</html>
