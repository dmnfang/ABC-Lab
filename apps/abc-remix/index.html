<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2E9">
  <title>ABC Remix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=8">
  <link rel="stylesheet" href="../../assets/css/base.css?v=8">
  <link rel="stylesheet" href="./remix.css?v=8">
</head>
<body data-game="remix">

  <!-- Settings -->
  <main id="settingsScreen" class="app-shell screen">
    <header class="app-header">
      <div class="header-left">
        <a class="icon-btn" href="../../index.html" data-icon="house" aria-label="ABC Lab home" title="ABC Lab home"></a>
        <h1 class="brand-name">ABC Remix</h1>
      </div>
      <div class="header-actions">
        <button id="settingsFullscreen" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
    </header>

    <div class="settings-main">
      <section class="panel panel--card">
        <h2 class="panel-title">Song</h2>

        <div class="control-section">
          <div class="settings-label">Song Version</div>
          <div id="songVersionButtons" class="toggle-group" role="group" aria-label="Song version">
            <button class="toggle-pill active" data-song="standard" type="button">Standard</button>
            <button class="toggle-pill" data-song="lmno" type="button">LMNOP</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Letter Case</div>
          <div id="letterCaseButtons" class="toggle-group" role="group" aria-label="Letter case">
            <button class="toggle-pill active" data-case="uppercase" type="button"><span class="pill-sample">ABC</span>Uppercase</button>
            <button class="toggle-pill" data-case="lowercase" type="button"><span class="pill-sample">abc</span>Lowercase</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Song Speed</div>
          <div id="speedButtons" class="toggle-group" role="group" aria-label="Song speed"></div>
        </div>

        <div class="control-section">
          <div class="settings-label">Number of Loops</div>
          <div id="loopButtons" class="toggle-group" role="group" aria-label="Number of loops"></div>
        </div>

        <div class="control-section">
          <div class="settings-label">Game Mode</div>
          <div id="modeButtons" class="toggle-group" role="group" aria-label="Game mode">
            <button class="toggle-pill active" data-mode="original" type="button">Original</button>
            <button class="toggle-pill" data-mode="random" type="button">Random</button>
          </div>
        </div>

        <div class="control-section">
          <div class="settings-label">Difficulty</div>
          <div id="difficultyButtons" class="toggle-group" role="group" aria-label="Difficulty">
            <button class="toggle-pill active" data-difficulty="easy" type="button">Easy</button>
            <button class="toggle-pill" data-difficulty="hard" type="button">Hard</button>
          </div>
        </div>
      </section>

      <section class="panel panel--card">
        <h2 class="panel-title">Song Preview</h2>
        <div id="previewInfo" class="preview-info"></div>
        <div id="modeContent" class="preview-content"></div>
        <button id="launchButton" class="launch-btn" type="button">Launch Song</button>
      </section>
    </div>
  </main>

  <!-- Game -->
  <main id="gameScreen" class="app-shell screen" hidden>
    <header class="app-header">
      <div class="header-left">
        <a class="icon-btn" href="../../index.html" data-icon="house" aria-label="ABC Lab home" title="ABC Lab home"></a>
        <h1 class="brand-name">ABC Remix</h1>
        <div id="progressDots" class="pips" aria-hidden="true"></div>
        <span id="loopBadge" class="loop-text" aria-live="polite" hidden></span>
      </div>
      <div class="header-actions">
        <button id="restartButton" class="icon-btn" type="button" data-icon="arrow-counter-clockwise" aria-label="Restart" title="Restart"></button>
        <button id="pauseButton" class="icon-btn" type="button" aria-label="Play" title="Play"></button>
        <button id="backButton" class="icon-btn" type="button" data-icon="gear" aria-label="Settings" title="Settings"></button>
        <button id="gameFullscreen" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
    </header>

    <section class="panel panel--card stage-panel">
      <div class="game-body">
        <div id="chunkStage" class="chunk-stage" aria-live="polite"></div>
        <div id="easyPreviewStage" class="easy-preview-stage" aria-hidden="true"></div>
        <div id="countInStage" class="count-in-stage" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js?v=8"></script>
</body>
</html>
